<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>قائمة المطعم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- ✅ Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, onSnapshot, serverTimestamp, query, orderBy }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // =====================================================
    // 🔧 CONFIG - ضع هنا بيانات مشروعك على Firebase
    // =====================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDTi6c6PwgOc35n3q7ibIzKTbBji_U2OCw",
      authDomain: "asia-7de4d.firebaseapp.com",
      projectId: "asia-7de4d",
      storageBucket: "asia-7de4d.firebasestorage.app",
      messagingSenderId: "1043386153538",
      appId: "1:1043386153538:web:0a0fb9660f32afbdb58bdb"
    };

    // =====================================================
    // 🔧 CONFIG - رابط الـ Backend على Railway
    // =====================================================
    const API_BASE_URL = "https://asia-app-production.up.railway.app";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- State ---
    let cart = [];
    let menuData = {}; // { categoryId: { name, items: [] } }
    let tableNumber = new URLSearchParams(location.search).get("table") || "1";

    // --- DOM refs ---
    const menuContainer = document.getElementById("menu-container");
    const cartCount     = document.getElementById("cart-count");
    const cartPanel     = document.getElementById("cart-panel");
    const cartItems     = document.getElementById("cart-items");
    const cartTotal     = document.getElementById("cart-total");
    const orderBtn      = document.getElementById("order-btn");
    const toast         = document.getElementById("toast");
    const tableLabel    = document.getElementById("table-label");
    const logoEl        = document.getElementById("logo");

    tableLabel.textContent = `طاولة رقم ${tableNumber}`;

    // =====================================================
    // 📦 LOAD MENU FROM FIRESTORE
    // =====================================================
    async function loadMenu() {
      menuContainer.innerHTML = `<div class="loading"><span></span><span></span><span></span></div>`;
      try {
        const catSnap = await getDocs(collection(db, "categories"));
        menuData = {};
        catSnap.forEach(doc => {
          menuData[doc.id] = { ...doc.data(), items: [] };
        });

        const itemSnap = await getDocs(collection(db, "menuItems"));
        itemSnap.forEach(doc => {
          const item = { id: doc.id, ...doc.data() };
          if (menuData[item.categoryId]) {
            menuData[item.categoryId].items.push(item);
          }
        });

        renderMenu();
      } catch (e) {
        menuContainer.innerHTML = `<p class="error-msg">⚠️ تعذّر تحميل القائمة، تحقق من اتصالك.</p>`;
        console.error(e);
      }
    }

    // =====================================================
    // 🎨 RENDER MENU
    // =====================================================
    function renderMenu() {
      menuContainer.innerHTML = "";

      const tabsHTML = Object.entries(menuData).map(([id, cat]) =>
        `<button class="tab-btn" data-cat="${id}">${cat.name}</button>`
      ).join("");

      const tabs = document.createElement("div");
      tabs.className = "tabs";
      tabs.innerHTML = tabsHTML;
      menuContainer.appendChild(tabs);

      const sectionsWrap = document.createElement("div");
      sectionsWrap.id = "sections";

      Object.entries(menuData).forEach(([id, cat]) => {
        const sec = document.createElement("section");
        sec.className = "category-section";
        sec.id = `cat-${id}`;
        sec.innerHTML = `<h2 class="cat-title">${cat.name}</h2>`;

        if (!cat.items.length) {
          sec.innerHTML += `<p class="empty-cat">لا توجد أصناف في هذه الفئة حالياً</p>`;
        }

        cat.items.forEach(item => {
          if (!item.available) return;
          sec.appendChild(buildItemCard(item));
        });

        sectionsWrap.appendChild(sec);
      });

      menuContainer.appendChild(sectionsWrap);

      // Tabs scroll behavior
      tabs.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const target = document.getElementById(`cat-${btn.dataset.cat}`);
          if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
          tabs.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
        });
      });

      tabs.querySelector(".tab-btn")?.classList.add("active");
    }

    function buildItemCard(item) {
      const card = document.createElement("div");
      card.className = "item-card";
      card.innerHTML = `
        ${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.name}" class="item-img" loading="lazy"/>` : ""}
        <div class="item-info">
          <h3 class="item-name">${item.name}</h3>
          ${item.description ? `<p class="item-desc">${item.description}</p>` : ""}
          <div class="item-footer">
            <span class="item-price">${item.price} ر.س</span>
            <button class="add-btn" data-id="${item.id}" data-name="${item.name}" data-price="${item.price}">
              + أضف
            </button>
          </div>
        </div>`;

      card.querySelector(".add-btn").addEventListener("click", e => {
        addToCart({ id: item.id, name: item.name, price: item.price });
        animateButton(e.target);
      });
      return card;
    }

    // =====================================================
    // 🛒 CART LOGIC
    // =====================================================
    function addToCart(item) {
      const existing = cart.find(i => i.id === item.id);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...item, qty: 1 });
      }
      updateCartUI();
      showToast(`تمت إضافة ${item.name} ✓`);
    }

    function updateCartUI() {
      cartCount.textContent = cart.reduce((s, i) => s + i.qty, 0);
      cartItems.innerHTML = "";

      if (!cart.length) {
        cartItems.innerHTML = `<p class="empty-cart">السلة فارغة</p>`;
        cartTotal.textContent = "0.00 ر.س";
        return;
      }

      let total = 0;
      cart.forEach(item => {
        total += item.price * item.qty;
        const row = document.createElement("div");
        row.className = "cart-row";
        row.innerHTML = `
          <span class="cart-name">${item.name}</span>
          <div class="cart-qty-ctrl">
            <button class="qty-btn" data-id="${item.id}" data-action="dec">−</button>
            <span>${item.qty}</span>
            <button class="qty-btn" data-id="${item.id}" data-action="inc">+</button>
          </div>
          <span class="cart-price">${(item.price * item.qty).toFixed(2)}</span>`;
        cartItems.appendChild(row);
      });

      cartTotal.textContent = `${total.toFixed(2)} ر.س`;

      cartItems.querySelectorAll(".qty-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;
          const idx = cart.findIndex(i => i.id === id);
          if (idx === -1) return;
          if (btn.dataset.action === "inc") cart[idx].qty++;
          else {
            cart[idx].qty--;
            if (cart[idx].qty <= 0) cart.splice(idx, 1);
          }
          updateCartUI();
        });
      });
    }

    // =====================================================
    // 📤 SEND ORDER TO FIRESTORE
    // =====================================================
    orderBtn.addEventListener("click", async () => {
      if (!cart.length) { showToast("السلة فارغة!", true); return; }

      orderBtn.disabled = true;
      orderBtn.textContent = "جارٍ الإرسال...";

      try {
        await addDoc(collection(db, "orders"), {
          tableNumber,
          items: cart.map(i => ({ itemId: i.id, name: i.name, price: i.price, qty: i.qty })),
          total: cart.reduce((s, i) => s + i.price * i.qty, 0),
          status: "pending",     // pending | preparing | done
          createdAt: serverTimestamp()
        });

        cart = [];
        updateCartUI();
        closeCart();
        showToast("✅ تم إرسال طلبك! سيصلك قريباً.");
      } catch (e) {
        showToast("⚠️ فشل الإرسال، حاول مرة أخرى", true);
        console.error(e);
      } finally {
        orderBtn.disabled = false;
        orderBtn.textContent = "إرسال الطلب";
      }
    });

    // =====================================================
    // 🔐 ADMIN SECRET - Double Click on Logo
    // =====================================================
    let clickTimer = null;
    logoEl.addEventListener("click", () => {
      if (clickTimer) {
        clearTimeout(clickTimer);
        clickTimer = null;
        const pass = prompt("🔐 أدخل كلمة السر للوصول للوحة الإدارة:");
        if (!pass) return;
        verifyAdmin(pass);
      } else {
        clickTimer = setTimeout(() => { clickTimer = null; }, 400);
      }
    });

    async function verifyAdmin(password) {
      try {
        const res = await fetch(`${API_BASE_URL}/api/admin/verify`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem("adminToken", data.token);
          window.location.href = "admin.html";
        } else {
          showToast("❌ كلمة السر غير صحيحة", true);
        }
      } catch {
        showToast("⚠️ تعذّر الاتصال بالخادم", true);
      }
    }

    // --- Cart panel toggle ---
    document.getElementById("cart-icon").addEventListener("click", () => {
      cartPanel.classList.toggle("open");
      updateCartUI();
    });
    document.getElementById("close-cart").addEventListener("click", closeCart);
    function closeCart() { cartPanel.classList.remove("open"); }

    // --- Toast ---
    function showToast(msg, isError = false) {
      toast.textContent = msg;
      toast.className = "toast show" + (isError ? " error" : "");
      setTimeout(() => toast.className = "toast", 2800);
    }

    function animateButton(btn) {
      btn.classList.add("pop");
      setTimeout(() => btn.classList.remove("pop"), 300);
    }

    // --- Init ---
    loadMenu();
    updateCartUI();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0e0c;
      --surface: #1a1814;
      --surface2: #232017;
      --gold: #c9a84c;
      --gold-light: #e8c97e;
      --text: #f0ead8;
      --text-muted: #8c8070;
      --accent: #d4582a;
      --radius: 14px;
      --font: 'Tajawal', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ---- HEADER ---- */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,14,12,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(201,168,76,0.15);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .logo-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
    .logo-icon {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--accent));
      display: grid; place-items: center; font-size: 22px;
    }
    .logo-text { font-size: 20px; font-weight: 900; color: var(--gold); letter-spacing: -0.5px; }
    .logo-sub  { font-size: 11px; color: var(--text-muted); }

    #table-label {
      font-size: 13px; color: var(--text-muted);
      background: var(--surface2); padding: 4px 12px; border-radius: 20px;
    }

    #cart-icon {
      position: relative; background: none; border: 2px solid var(--gold);
      color: var(--gold); width: 44px; height: 44px; border-radius: 50%;
      font-size: 20px; cursor: pointer; display: grid; place-items: center;
      transition: background .2s;
    }
    #cart-icon:hover { background: rgba(201,168,76,0.1); }
    #cart-count {
      position: absolute; top: -6px; right: -6px;
      background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
      min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center;
    }

    /* ---- TABS ---- */
    .tabs {
      display: flex; gap: 8px; padding: 16px 16px 0;
      overflow-x: auto; scrollbar-width: none;
      position: sticky; top: 73px; z-index: 90;
      background: var(--bg);
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0; padding: 8px 18px; border-radius: 20px;
      border: 1px solid rgba(201,168,76,0.3); background: transparent;
      color: var(--text-muted); font-family: var(--font); font-size: 14px;
      cursor: pointer; transition: all .2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--gold); color: var(--bg); font-weight: 700; border-color: var(--gold);
    }

    /* ---- MENU ---- */
    #menu-container { padding-bottom: 100px; }

    .category-section { padding: 24px 16px 8px; }
    .cat-title {
      font-size: 22px; font-weight: 900; color: var(--gold-light);
      padding-bottom: 12px; border-bottom: 1px solid rgba(201,168,76,0.2);
      margin-bottom: 16px;
    }

    .item-card {
      display: flex; background: var(--surface); border-radius: var(--radius);
      margin-bottom: 12px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform .2s, box-shadow .2s;
    }
    .item-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }

    .item-img { width: 110px; height: 110px; object-fit: cover; flex-shrink: 0; }
    .item-info { flex: 1; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }
    .item-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .item-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; flex: 1; }
    .item-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .item-price { font-size: 16px; font-weight: 900; color: var(--gold); }

    .add-btn {
      background: linear-gradient(135deg, var(--gold), var(--accent));
      color: #fff; border: none; padding: 8px 18px; border-radius: 20px;
      font-family: var(--font); font-size: 14px; font-weight: 700;
      cursor: pointer; transition: transform .15s, opacity .15s;
    }
    .add-btn:hover { opacity: .9; }
    .add-btn.pop { transform: scale(1.2); }

    /* ---- CART PANEL ---- */
    #cart-panel {
      position: fixed; inset: 0; z-index: 200;
      pointer-events: none;
    }
    #cart-panel.open { pointer-events: all; }

    .cart-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.5);
      opacity: 0; transition: opacity .3s;
    }
    #cart-panel.open .cart-overlay { opacity: 1; }

    .cart-drawer {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
      padding: 20px; max-height: 85vh; overflow-y: auto;
      transform: translateY(100%); transition: transform .35s cubic-bezier(.4,0,.2,1);
      border-top: 1px solid rgba(201,168,76,0.2);
    }
    #cart-panel.open .cart-drawer { transform: translateY(0); }

    .cart-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
    }
    .cart-header h3 { font-size: 20px; font-weight: 900; color: var(--gold-light); }
    #close-cart {
      background: none; border: none; color: var(--text-muted);
      font-size: 22px; cursor: pointer; line-height: 1;
    }

    .cart-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .cart-name { flex: 1; font-size: 14px; }
    .cart-qty-ctrl { display: flex; align-items: center; gap: 8px; }
    .qty-btn {
      width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--gold);
      background: none; color: var(--gold); font-size: 16px; cursor: pointer;
      display: grid; place-items: center; transition: background .15s;
    }
    .qty-btn:hover { background: rgba(201,168,76,0.15); }
    .cart-price { font-weight: 700; color: var(--gold); width: 70px; text-align: left; }

    .cart-footer {
      margin-top: 16px; display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 12px;
    }
    .total-label { font-size: 13px; color: var(--text-muted); }
    #cart-total { font-size: 22px; font-weight: 900; color: var(--gold-light); display: block; }

    #order-btn {
      background: linear-gradient(135deg, var(--gold), var(--accent));
      color: #fff; border: none; padding: 14px 28px; border-radius: 30px;
      font-family: var(--font); font-size: 16px; font-weight: 900;
      cursor: pointer; transition: opacity .2s;
      box-shadow: 0 4px 20px rgba(212,88,42,0.35);
    }
    #order-btn:disabled { opacity: .5; cursor: not-allowed; }
    #order-btn:not(:disabled):hover { opacity: .9; }

    /* ---- LOADING ---- */
    .loading {
      display: flex; justify-content: center; gap: 10px; padding: 60px;
    }
    .loading span {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--gold); animation: pulse 1.2s infinite;
    }
    .loading span:nth-child(2) { animation-delay: .2s; }
    .loading span:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse { 0%,100%{opacity:.2;transform:scale(.8)} 50%{opacity:1;transform:scale(1.1)} }

    .error-msg, .empty-cat, .empty-cart {
      color: var(--text-muted); text-align: center; padding: 24px; font-size: 15px;
    }

    /* ---- TOAST ---- */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #2a2520; color: var(--text); padding: 12px 24px; border-radius: 30px;
      font-size: 14px; font-weight: 700; opacity: 0; transition: all .3s; z-index: 999;
      border: 1px solid rgba(201,168,76,0.3); white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: var(--accent); color: #ff9070; }
  </style>
</head>
<body>

<header>
  <div class="logo-wrap" id="logo">
    <img src="https://raw.githubusercontent.com/mohamedmmmm1335-glitch/Asia-app-/main/logo.png" style="width:44px;height:44px;border-radius:50%;object-fit:cover;" alt="لوجو"/>
    <div>
      <div class="logo-text">مطعم آسيا</div>
      <div class="logo-sub">كريب و بروست</div>
    </div>
  </div>
  <span id="table-label"></span>
  <button id="cart-icon" aria-label="السلة">🛒
    <span id="cart-count">0</span>
  </button>
</header>

<main id="menu-container"></main>

<!-- CART PANEL -->
<div id="cart-panel">
  <div class="cart-overlay"></div>
  <div class="cart-drawer">
    <div class="cart-header">
      <h3>🛒 سلة الطلبات</h3>
      <button id="close-cart">✕</button>
    </div>
    <div id="cart-items"></div>
    <div class="cart-footer">
      <div>
        <span class="total-label">المجموع</span>
        <span id="cart-total">0.00 ر.س</span>
      </div>
      <button id="order-btn">إرسال الطلب</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

</body>
</html>
