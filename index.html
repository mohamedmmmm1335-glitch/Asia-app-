  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, serverTimestamp, doc, onSnapshot, deleteDoc }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getMessaging, getToken, onMessage }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";
    import { getAuth, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTi6c6PwgOc35n3q7ibIzKTbBji_U2OCw",
      authDomain: "asia-7de4d.firebaseapp.com",
      projectId: "asia-7de4d",
      storageBucket: "asia-7de4d.firebasestorage.app",
      messagingSenderId: "1043386153538",
      appId: "1:1043386153538:web:0a0fb9660f32afbdb58bdb"
    };

    const API_BASE_URL = "https://asia-app-production.up.railway.app";

    const app       = initializeApp(firebaseConfig);
    const db        = getFirestore(app);
    const messaging = getMessaging(app);
    const auth      = getAuth(app);

    let currentUser = null;

    // تحقق من تسجيل الدخول
    onAuthStateChanged(auth, user => {
      currentUser = user;
      if (user) {
        document.getElementById("user-name").textContent = user.displayName || "مرحباً";
        document.getElementById("user-bar").style.display = "flex";
      }
    });

    const FCM_VAPID_KEY = "BO5PsDDmko5pBJ0YsmR7oZ8GZWyG1LiPcd2CVjw1DKO6wWCGlLZFVqdp9nBB_2ErtoV2VzXrSxXzlTEb9QFUdfM";

    // =====================================================
    // 🔔 PUSH NOTIFICATIONS - اشتراك الزبون
    // =====================================================
    async function subscribePush() {
      try {
        const permission = await Notification.requestPermission();
        if (permission !== "granted") return;

        const token = await getToken(messaging, {
          vapidKey: FCM_VAPID_KEY,
          serviceWorkerRegistration: await navigator.serviceWorker.ready
        });

        if (token) {
          // حفظ التوكن في localStorage
          localStorage.setItem("fcmToken", token);
          // حفظه في Firestore عشان الأدمن يبعتله إشعار
          await addDoc(collection(db, "fcmTokens"), {
            token,
            type: "customer",
            tableNumber,
            createdAt: serverTimestamp()
          });
        }
      } catch (e) {
        console.log("Push permission denied or error:", e);
      }
    }

    // استقبال الإشعارات لما التطبيق مفتوح
    onMessage(messaging, payload => {
      const { title, body } = payload.notification;
      showToast(`🔔 ${title}: ${body}`);
    });

    let cart = [];
    let menuData = {};
    let currentCatId = null;
    let tableNumber = new URLSearchParams(location.search).get("table") || "1";

    const menuContainer = document.getElementById("menu-container");
    const cartCount     = document.getElementById("cart-count");
    const cartPanel     = document.getElementById("cart-panel");
    const cartItems     = document.getElementById("cart-items");
    const cartTotal     = document.getElementById("cart-total");
    const orderBtn      = document.getElementById("order-btn");
    const toast         = document.getElementById("toast");
    const logoEl        = document.getElementById("logo");

    // حفظ القسم الحالي عند الريفريش
    if (sessionStorage.getItem('currentCat')) {
      // سيتم التطبيق بعد loadMenu
    }

    // =====================================================
    // 📦 LOAD MENU
    // =====================================================
    async function loadMenu() {
      menuContainer.innerHTML = `<div class="loading"><span></span><span></span><span></span></div>`;
      try {
        const catSnap = await getDocs(collection(db, "categories"));
        menuData = {};
        catSnap.forEach(doc => {
          const data = doc.data();
          menuData[doc.id] = {
            name: data.name || "بدون اسم",
            imageUrl: data.imageUrl || "",
            order: data.order || 99,
            items: []
          };
        });

        const itemSnap = await getDocs(collection(db, "menuItems"));
        itemSnap.forEach(doc => {
          const item = { id: doc.id, ...doc.data() };
          if (menuData[item.categoryId]) {
            menuData[item.categoryId].items.push(item);
          }
        });

        const saved = sessionStorage.getItem("currentCat");
        if (saved && menuData[saved]) renderItems(saved);
        else renderCategoryGrid();
      } catch (e) {
        menuContainer.innerHTML = `<p class="error-msg">⚠️ تعذّر تحميل القائمة</p>`;
        console.error(e);
      }
    }

    // =====================================================
    // 🎨 RENDER CATEGORY GRID
    // =====================================================
    const CAT_EMOJIS = {
      "كريب": "🥞", "بروست": "🍗", "ساندوتشات": "🥙",
      "سوري": "🫓", "ميكسات كريب": "🍽️", "إضافات": "🧀"
    };

    function renderCategoryGrid() {
      menuContainer.innerHTML = "";
      currentCatId = null;
      sessionStorage.removeItem("currentCat");

      // زر الرجوع - لو في الجريد مش محتاج يعمل حاجة
      history.replaceState({ page: "home" }, "");

      const title = document.createElement("div");
      title.className = "page-title";
      title.innerHTML = `<h2>اختر قسمك</h2><p>اضغط على القسم لرؤية الأصناف</p>`;
      menuContainer.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "cat-grid";

      const sorted = Object.entries(menuData).sort((a,b) => a[1].order - b[1].order);

      sorted.forEach(([id, cat]) => {
        const card = document.createElement("div");
        card.className = "cat-card";
        const emoji = CAT_EMOJIS[cat.name] || "🍴";

        // Lazy loading للصور
        card.innerHTML = `
          <div class="cat-img-wrap">
            ${cat.imageUrl
              ? `<img data-src="${cat.imageUrl}" alt="${cat.name}" class="cat-img lazy" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3C/svg%3E"/>`
              : `<div class="cat-emoji">${emoji}</div>`}
          </div>
          <div class="cat-name">${cat.name}</div>
          <div class="cat-count">${cat.items.filter(i=>i.available).length} صنف</div>`;

        card.addEventListener("click", () => renderItems(id));
        grid.appendChild(card);
      });

      menuContainer.appendChild(grid);
      initLazyLoad();
    }

    // =====================================================
    // 🍔 RENDER ITEMS
    // =====================================================
    function renderItems(catId) {
      currentCatId = catId;
      sessionStorage.setItem("currentCat", catId);

      // زر الرجوع من الموبايل
      history.pushState({ page: "items", catId }, "");

      const cat = menuData[catId];
      menuContainer.innerHTML = "";

      const backBar = document.createElement("div");
      backBar.className = "back-bar";
      backBar.innerHTML = `
        <button class="back-btn" id="back-btn">← رجوع</button>
        <h2 class="section-title">${cat.name}</h2>`;
      menuContainer.appendChild(backBar);
      document.getElementById("back-btn").addEventListener("click", () => {
        history.back();
      });

      const availItems = cat.items.filter(i => i.available);
      if (!availItems.length) {
        menuContainer.innerHTML += `<p class="empty-cat">لا توجد أصناف متاحة حالياً</p>`;
        return;
      }

      const grid = document.createElement("div");
      grid.className = "items-grid";
      availItems.forEach(item => grid.appendChild(buildItemCard(item)));
      menuContainer.appendChild(grid);
      initLazyLoad();
    }

    // زر الرجوع من الموبايل
    window.addEventListener("popstate", (e) => {
      if (e.state?.page === "home" || !e.state) {
        renderCategoryGrid();
      }
    });

    function buildItemCard(item) {
      const card = document.createElement("div");
      card.className = "item-card";
      card.innerHTML = `
        ${item.imageUrl
          ? `<img data-src="${item.imageUrl}" alt="${item.name}" class="item-img lazy" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3C/svg%3E"/>`
          : `<div class="item-img-ph">🍴</div>`}
        <div class="item-info">
          <h3 class="item-name">${item.name}</h3>
          ${item.description ? `<p class="item-desc">${item.description}</p>` : ""}
          <div class="item-footer">
            <span class="item-price">${item.price} ج.م</span>
            <button class="add-btn">+ أضف</button>
          </div>
        </div>`;

      card.querySelector(".add-btn").addEventListener("click", e => {
        addToCart({ id: item.id, name: item.name, price: item.price });
        e.target.classList.add("pop");
        setTimeout(() => e.target.classList.remove("pop"), 300);
      });
      return card;
    }

    // =====================================================
    // 🖼️ LAZY LOAD
    // =====================================================
    function initLazyLoad() {
      const lazyImgs = document.querySelectorAll("img.lazy");
      if (!lazyImgs.length) return;

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            img.src = img.dataset.src;
            img.classList.remove("lazy");
            img.classList.add("lazy-loaded");
            observer.unobserve(img);
          }
        });
      }, { rootMargin: "100px" });

      lazyImgs.forEach(img => observer.observe(img));
    }

    // =====================================================
    // 🛒 CART - بتتحفظ في localStorage
    // =====================================================
    function saveCart() { localStorage.setItem("asiaCart", JSON.stringify(cart)); }
    function loadCart() {
      try { cart = JSON.parse(localStorage.getItem("asiaCart")) || []; }
      catch { cart = []; }
    }

    function addToCart(item) {
      const ex = cart.find(i => i.id === item.id);
      if (ex) ex.qty++;
      else cart.push({ ...item, qty: 1 });
      saveCart();
      updateCartUI();
      showToast(`تمت إضافة ${item.name} ✓`);
    }

    function updateCartUI() {
      const total = cart.reduce((s,i) => s + i.price * i.qty, 0);
      cartCount.textContent = cart.reduce((s,i) => s + i.qty, 0);
      cartItems.innerHTML = "";

      // لو عنده طلب نشط اعرضه
      const activeOrder = localStorage.getItem("activeOrder");
      if (activeOrder) {
        showActiveOrder(JSON.parse(activeOrder));
        return;
      }

      if (!cart.length) {
        cartItems.innerHTML = `<p class="empty-cart">السلة فارغة</p>`;
        cartTotal.textContent = "0 ج.م";
        orderBtn.textContent  = "تواصل معنا لتأكيد طلبك";
        return;
      }

      cart.forEach(item => {
        const row = document.createElement("div");
        row.className = "cart-row";
        row.innerHTML = `
          <span class="cart-name">${item.name}</span>
          <div class="cart-qty-ctrl">
            <button class="qty-btn" data-id="${item.id}" data-action="dec">−</button>
            <span>${item.qty}</span>
            <button class="qty-btn" data-id="${item.id}" data-action="inc">+</button>
          </div>
          <span class="cart-price">${(item.price * item.qty).toFixed(0)} ج.م</span>`;
        cartItems.appendChild(row);
      });

      cartTotal.textContent = `${total.toFixed(0)} ج.م`;

      // زرار بيتغير حسب حالة الدخول
      if (currentUser) {
        orderBtn.textContent = "📞 تواصل معنا لتأكيد طلبك";
        orderBtn.style.background = "linear-gradient(135deg, #25d366, #128c7e)";
      } else {
        orderBtn.textContent = "سجل دخول لتأكيد طلبك";
        orderBtn.style.background = "";
      }

      cartItems.querySelectorAll(".qty-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = cart.findIndex(i => i.id === btn.dataset.id);
          if (idx === -1) return;
          if (btn.dataset.action === "inc") cart[idx].qty++;
          else { cart[idx].qty--; if (cart[idx].qty <= 0) cart.splice(idx,1); }
          saveCart();
          updateCartUI();
        });
      });
    }

    // =====================================================
    // 📋 عرض الطلب النشط مع حالته
    // =====================================================
    const STATUS_MAP = {
      "pending":   { label: "⏳ تم التأكيد", color: "#f0b429" },
      "preparing": { label: "👨‍🍳 يتم التجهيز", color: "#63b3ed" },
      "done":      { label: "✅ طلبك جاهز الآن!", color: "#48bb78" },
      "received":  { label: "🎉 تم الاستلام", color: "#9f7aea" }
    };

    function showActiveOrder(order) {
      cartItems.innerHTML = `
        <div class="active-order">
          <div class="order-status-badge" style="background:${STATUS_MAP[order.status]?.color || '#f0b429'}22;border:2px solid ${STATUS_MAP[order.status]?.color || '#f0b429'};color:${STATUS_MAP[order.status]?.color || '#f0b429'};">
            ${STATUS_MAP[order.status]?.label || order.status}
          </div>
          <div class="order-details-title">تفاصيل طلبك:</div>
          <ul class="order-details-list">
            ${order.items.map(i => `<li>${i.name} × ${i.qty} — <b>${(i.price*i.qty).toFixed(0)} ج.م</b></li>`).join("")}
          </ul>
          <div class="order-total-line">الإجمالي: <b>${order.total?.toFixed(0)} ج.م</b></div>
          ${order.status === "pending" ? `<button class="cancel-order-btn" id="cancel-order-btn">❌ إلغاء الطلب</button>` : ""}
          ${order.status === "received" ? `<button class="clear-order-btn" id="clear-order-btn">🗑️ مسح الطلب</button>` : ""}
        </div>`;

      cartTotal.textContent = `${order.total?.toFixed(0)} ج.م`;
      orderBtn.textContent  = "📞 تواصل مع الديليفري";
      orderBtn.style.background = "linear-gradient(135deg, #25d366, #128c7e)";

      // إلغاء الطلب - فقط لو pending
      document.getElementById("cancel-order-btn")?.addEventListener("click", async () => {
        if (!confirm("هل أنت متأكد من إلغاء الطلب؟")) return;
        try {
          await deleteDoc(doc(db, "orders", order.id));
          localStorage.removeItem("activeOrder");
          cart = []; saveCart(); updateCartUI();
          showToast("✅ تم إلغاء الطلب");
        } catch { showToast("⚠️ فشل الإلغاء، حاول تاني", true); }
      });

      // مسح بعد الاستلام
      document.getElementById("clear-order-btn")?.addEventListener("click", () => {
        localStorage.removeItem("activeOrder");
        cart = []; saveCart(); updateCartUI();
        showToast("تم مسح الطلب ✅");
      });

      listenOrderStatus(order.id);
    }

    let orderUnsubscribe = null;
    function listenOrderStatus(orderId) {
      if (orderUnsubscribe) orderUnsubscribe();
      orderUnsubscribe = onSnapshot(doc(db, "orders", orderId), snap => {
        if (!snap.exists()) {
          localStorage.removeItem("activeOrder");
          cart = []; saveCart(); updateCartUI();
          return;
        }
        const order = { id: snap.id, ...snap.data() };
        localStorage.setItem("activeOrder", JSON.stringify(order));
        if (cartPanel.classList.contains("open")) showActiveOrder(order);
      });
    }

    // =====================================================
    // 📤 إرسال الطلب
    // =====================================================
    orderBtn.addEventListener("click", async () => {
      // لو عنده طلب نشط افتح واتساب
      const activeOrder = localStorage.getItem("activeOrder");
      if (activeOrder) {
        showContactSheet();
        return;
      }

      if (!cart.length) { showToast("السلة فارغة!", true); return; }

      // لو مش مسجل احفظ مكانه وروّحه للتسجيل
      if (!currentUser) {
        localStorage.setItem("returnToCart", "1");
        window.location.href = "auth.html";
        return;
      }

      // مسجل → بعت الطلب وعرض الاتصال
      orderBtn.disabled = true;
      try {
        const ref = await addDoc(collection(db, "orders"), {
          userId:        currentUser.uid,
          userName:      currentUser.displayName || "",
          items:         cart.map(i => ({ itemId: i.id, name: i.name, price: i.price, qty: i.qty })),
          total:         cart.reduce((s,i) => s + i.price * i.qty, 0),
          status:        "pending",
          customerToken: localStorage.getItem("fcmToken") || "",
          createdAt:     serverTimestamp()
        });

        // حفظ الطلب النشط
        const orderData = {
          id: ref.id,
          items: cart.map(i => ({ name: i.name, price: i.price, qty: i.qty })),
          total: cart.reduce((s,i) => s + i.price * i.qty, 0),
          status: "pending"
        };
        localStorage.setItem("activeOrder", JSON.stringify(orderData));

        // إشعار للأدمن
        try {
          await fetch(`${API_BASE_URL}/api/notify/admin`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title: `طلب جديد 🔔`,
              body: `${currentUser.displayName} - ${cart.reduce((s,i) => s+i.qty,0)} صنف - ${cart.reduce((s,i) => s+i.price*i.qty,0).toFixed(0)} ج.م`
            })
          });
        } catch {}

        updateCartUI();
        showContactSheet();
        showToast("✅ تم إرسال طلبك!");
      } catch { showToast("⚠️ فشل الإرسال", true); }
      finally { orderBtn.disabled = false; }
    });

    // =====================================================
    // 📞 شاشة التواصل
    // =====================================================
    function showContactSheet() {
      document.getElementById("contact-sheet").style.display = "flex";
    }
    document.getElementById("contact-close").addEventListener("click", () => {
      document.getElementById("contact-sheet").style.display = "none";
    });
    document.getElementById("wa-btn-1").addEventListener("click", () => {
      window.open("https://wa.me/201012175853", "_blank");
    });
    document.getElementById("call-btn-1").addEventListener("click", () => {
      window.open("tel:01111306898");
    });
    document.getElementById("call-btn-2").addEventListener("click", () => {
      window.open("tel:01273076533");
    });

    // Auth prompt - لو رجع من صفحة التسجيل افتح السلة
    if (localStorage.getItem("returnToCart")) {
      localStorage.removeItem("returnToCart");
      setTimeout(() => {
        cartPanel.classList.add("open");
        updateCartUI();
      }, 500);
    }

    // تسجيل الخروج
    document.getElementById("logout-btn")?.addEventListener("click", async () => {
      await signOut(auth);
      document.getElementById("user-bar").style.display = "none";
      currentUser = null;
      updateCartUI();
    });

    // Admin double-click
    let clickTimer = null;
    logoEl.addEventListener("click", () => {
      if (clickTimer) {
        clearTimeout(clickTimer); clickTimer = null;
        const pass = prompt("🔐 كلمة السر:");
        if (!pass) return;
        verifyAdmin(pass);
      } else {
        clickTimer = setTimeout(() => { clickTimer = null; }, 400);
      }
    });

    async function verifyAdmin(password) {
      try {
        const res  = await fetch(`${API_BASE_URL}/api/admin/verify`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.success) { localStorage.setItem("adminToken", data.token); window.location.href = "admin.html"; }
        else showToast("❌ كلمة السر خاطئة", true);
      } catch { showToast("⚠️ خطأ في الاتصال", true); }
    }

    document.getElementById("cart-icon").addEventListener("click", () => {
      cartPanel.classList.toggle("open"); updateCartUI();
    });
    document.getElementById("close-cart").addEventListener("click", closeCart);
    function closeCart() { cartPanel.classList.remove("open"); }

    function showToast(msg, isError=false) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "toast show" + (isError ? " error" : "");
      setTimeout(() => t.className = "toast", 2800);
    }

    loadCart();
    loadMenu();
    updateCartUI();
    // اشتراك في الإشعارات بعد 5 ثواني
    setTimeout(subscribePush, 5000);

    // لو عنده طلب نشط ابدأ مراقبته
