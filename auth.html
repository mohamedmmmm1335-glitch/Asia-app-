<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مطعم آسيا - تسجيل الدخول</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#c9a84c"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
      GoogleAuthProvider, signInWithPopup, updateProfile, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore, doc, setDoc, getDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTi6c6PwgOc35n3q7ibIzKTbBji_U2OCw",
      authDomain: "asia-7de4d.firebaseapp.com",
      projectId: "asia-7de4d",
      storageBucket: "asia-7de4d.firebasestorage.app",
      messagingSenderId: "1043386153538",
      appId: "1:1043386153538:web:0a0fb9660f32afbdb58bdb"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // لو الزبون مسجل دخول أصلاً روح للمنيو
    onAuthStateChanged(auth, user => {
      if (user) window.location.href = "index.html";
    });

    // =====================================================
    // TAB SWITCH
    // =====================================================
    const loginTab    = document.getElementById("login-tab");
    const registerTab = document.getElementById("register-tab");
    const loginForm   = document.getElementById("login-form");
    const registerForm= document.getElementById("register-form");

    loginTab.addEventListener("click", () => {
      loginTab.classList.add("active");
      registerTab.classList.remove("active");
      loginForm.style.display = "block";
      registerForm.style.display = "none";
    });

    registerTab.addEventListener("click", () => {
      registerTab.classList.add("active");
      loginTab.classList.remove("active");
      registerForm.style.display = "block";
      loginForm.style.display = "none";
    });

    // =====================================================
    // 🔐 LOGIN
    // =====================================================
    document.getElementById("login-btn").addEventListener("click", async () => {
      const phone    = document.getElementById("login-phone").value.trim();
      const password = document.getElementById("login-pass").value;
      if (!phone || !password) { showToast("ادخل رقم الموبايل والباسورد", true); return; }

      // نحول رقم الموبايل لإيميل وهمي
      const email = `${phone}@asia-menu.app`;
      setLoading("login-btn", true);
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "index.html";
      } catch (e) {
        showToast("رقم الموبايل أو الباسورد غلط ❌", true);
      } finally { setLoading("login-btn", false); }
    });

    // =====================================================
    // 📝 REGISTER
    // =====================================================
    document.getElementById("register-btn").addEventListener("click", async () => {
      const name     = document.getElementById("reg-name").value.trim();
      const phone    = document.getElementById("reg-phone").value.trim();
      const address  = document.getElementById("reg-address").value.trim();
      const password = document.getElementById("reg-pass").value;
      const confirm  = document.getElementById("reg-confirm").value;

      if (!name || !phone || !password) { showToast("ادخل كل البيانات المطلوبة", true); return; }
      if (password !== confirm) { showToast("الباسورد مش متطابق ❌", true); return; }
      if (password.length < 6) { showToast("الباسورد لازم 6 أحرف على الأقل", true); return; }

      const email = `${phone}@asia-menu.app`;
      setLoading("register-btn", true);
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: name });

        // حفظ بيانات الزبون في Firestore
        await setDoc(doc(db, "customers", cred.user.uid), {
          name, phone, address: address || "",
          email, createdAt: serverTimestamp()
        });

        window.location.href = "index.html";
      } catch (e) {
        if (e.code === "auth/email-already-in-use") {
          showToast("الرقم ده عنده حساب بالفعل، سجل دخول ✅", true);
          loginTab.click();
        } else {
          showToast("حصل خطأ، حاول تاني ❌", true);
        }
      } finally { setLoading("register-btn", false); }
    });

    // =====================================================
    // 🔵 GOOGLE LOGIN
    // =====================================================
    document.getElementById("google-btn").addEventListener("click", async () => {
      const provider = new GoogleAuthProvider();
      setLoading("google-btn", true);
      try {
        const result = await signInWithPopup(auth, provider);
        const user   = result.user;

        // لو أول مرة يسجل بجوجل
        const userDoc = await getDoc(doc(db, "customers", user.uid));
        if (!userDoc.exists()) {
          await setDoc(doc(db, "customers", user.uid), {
            name:      user.displayName || "",
            phone:     "",
            address:   "",
            email:     user.email,
            createdAt: serverTimestamp()
          });
        }
        window.location.href = "index.html";
      } catch (e) {
        showToast("فشل تسجيل الدخول بجوجل ❌", true);
      } finally { setLoading("google-btn", false); }
    });

    // =====================================================
    // HELPERS
    // =====================================================
    function showToast(msg, isError=false) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "toast show" + (isError ? " error" : "");
      setTimeout(() => t.className = "toast", 3000);
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      if (loading) btn.dataset.orig = btn.textContent;
      btn.textContent = loading ? "⏳ جارٍ..." : btn.dataset.orig;
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0e0c; --surface: #1a1814; --surface2: #232017;
      --gold: #c9a84c; --gold-light: #e8c97e; --accent: #d4582a;
      --text: #f0ead8; --muted: #8c8070; --radius: 16px;
      --font: 'Tajawal', sans-serif;
    }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
    }

    .auth-box {
      width: 100%; max-width: 400px;
      background: var(--surface); border-radius: var(--radius);
      border: 1px solid rgba(201,168,76,0.2); overflow: hidden;
    }

    /* HEADER */
    .auth-header {
      text-align: center; padding: 28px 20px 20px;
      background: linear-gradient(135deg, rgba(201,168,76,0.1), rgba(212,88,42,0.1));
      border-bottom: 1px solid rgba(201,168,76,0.15);
    }
    .auth-logo { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; }
    .auth-title { font-size: 22px; font-weight: 900; color: var(--gold-light); }
    .auth-sub   { font-size: 13px; color: var(--muted); margin-top: 4px; }

    /* TABS */
    .auth-tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .auth-tab {
      flex: 1; padding: 14px; text-align: center; font-family: var(--font);
      font-size: 15px; font-weight: 700; color: var(--muted);
      background: none; border: none; border-bottom: 2px solid transparent;
      cursor: pointer; transition: all .2s;
    }
    .auth-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* FORMS */
    .auth-body { padding: 24px 20px; }

    #register-form { display: none; }

    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
    label:first-child { margin-top: 0; }

    input {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      background: var(--surface2); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text); font-family: var(--font); font-size: 15px;
      transition: border-color .2s;
    }
    input:focus { outline: none; border-color: var(--gold); }
    input::placeholder { color: var(--muted); }

    .main-btn {
      width: 100%; margin-top: 20px; padding: 14px;
      background: linear-gradient(135deg, var(--gold), var(--accent));
      color: #fff; border: none; border-radius: 30px;
      font-family: var(--font); font-size: 16px; font-weight: 900;
      cursor: pointer; transition: opacity .2s;
      box-shadow: 0 4px 20px rgba(212,88,42,0.3);
    }
    .main-btn:disabled { opacity: .5; cursor: not-allowed; }

    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 18px 0; color: var(--muted); font-size: 13px;
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.08);
    }

    .google-btn {
      width: 100%; padding: 12px; border-radius: 30px;
      background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text); font-family: var(--font); font-size: 15px;
      font-weight: 700; cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 10px; transition: background .2s;
    }
    .google-btn:hover { background: rgba(255,255,255,0.05); }
    .google-btn:disabled { opacity: .5; cursor: not-allowed; }
    .google-icon { width: 20px; height: 20px; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--surface); color: var(--text); padding: 12px 24px; border-radius: 30px;
      font-size: 14px; font-weight: 700; opacity: 0; transition: all .3s; z-index: 999;
      border: 1px solid rgba(201,168,76,0.3); white-space: nowrap; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: var(--accent); color: #ff9070; }
  </style>
</head>
<body>

<div class="auth-box">
  <div class="auth-header">
    <img src="https://raw.githubusercontent.com/mohamedmmmm1335-glitch/Asia-app-/main/logo.png" class="auth-logo" alt="لوجو"/>
    <div class="auth-title">مطعم آسيا</div>
    <div class="auth-sub">سجل دخولك لإتمام الطلب</div>
  </div>

  <div class="auth-tabs">
    <button class="auth-tab active" id="login-tab">تسجيل الدخول</button>
    <button class="auth-tab" id="register-tab">إنشاء حساب</button>
  </div>

  <div class="auth-body">

    <!-- LOGIN FORM -->
    <div id="login-form">
      <label>رقم الموبايل *</label>
      <input type="tel" id="login-phone" placeholder="01xxxxxxxxx"/>
      <label>الباسورد *</label>
      <input type="password" id="login-pass" placeholder="••••••"/>
      <button class="main-btn" id="login-btn">دخول</button>

      <div class="divider">أو</div>

      <button class="google-btn" id="google-btn">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        تسجيل الدخول بجوجل
      </button>
    </div>

    <!-- REGISTER FORM -->
    <div id="register-form">
      <label>الاسم الكامل *</label>
      <input type="text" id="reg-name" placeholder="محمد أحمد"/>
      <label>رقم الموبايل *</label>
      <input type="tel" id="reg-phone" placeholder="01xxxxxxxxx"/>
      <label>العنوان</label>
      <input type="text" id="reg-address" placeholder="شارع، حي، مدينة"/>
      <label>الباسورد *</label>
      <input type="password" id="reg-pass" placeholder="6 أحرف على الأقل"/>
      <label>تأكيد الباسورد *</label>
      <input type="password" id="reg-confirm" placeholder="••••••"/>
      <button class="main-btn" id="register-btn">إنشاء الحساب</button>

      <div class="divider">أو</div>

      <button class="google-btn" id="google-btn-reg" onclick="document.getElementById('google-btn').click()">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        التسجيل بجوجل
      </button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>
</body>
</html>
